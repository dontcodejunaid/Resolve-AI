<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgArjun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="hoodieArjun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadowArjun" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="60" cy="60" r="58" fill="url(#bgArjun)" stroke="#FB923C" stroke-width="2"/>

  <!-- Subtle BG Glow -->
  <circle cx="60" cy="35" r="40" fill="#FED7AA" opacity="0.25"/>

  <!-- Body / Hoodie -->
  <path d="M22 116 C22 92 38 82 60 82 C82 82 98 92 98 116 Z" fill="url(#hoodieArjun)"/>

  <!-- Hoodie String & Collar Detail -->
  <path d="M46 82 Q60 98 74 82" stroke="#EA580C" stroke-width="3" fill="none"/>
  <line x1="53" y1="90" x2="53" y2="104" stroke="#EA580C" stroke-width="2" stroke-linecap="round"/>
  <line x1="67" y1="90" x2="67" y2="104" stroke="#EA580C" stroke-width="2" stroke-linecap="round"/>

  <!-- Neck -->
  <rect x="52" y="66" width="16" height="20" rx="3" fill="#D97706"/>

  <!-- Head Base -->
  <ellipse cx="60" cy="54" rx="21" ry="24" fill="#F59E0B" filter="url(#shadowArjun)"/>

  <!-- Ears -->
  <ellipse cx="38" cy="54" rx="4" ry="7" fill="#D97706"/>
  <ellipse cx="82" cy="54" rx="4" ry="7" fill="#D97706"/>

  <!-- Hair (Fade + Textured Top) -->
  <path d="M38 46 C38 24 50 18 64 20 C76 22 82 30 82 46 C78 36 70 30 60 30 C50 30 42 36 38 46 Z" fill="#292524"/>
  <path d="M40 28 C48 18 68 18 78 26 C82 30 76 24 64 22 C52 20 44 24 40 28 Z" fill="#1C1917"/>

  <!-- Eyes -->
  <circle cx="50" cy="52" r="3" fill="#1C1917"/>
  <circle cx="70" cy="52" r="3" fill="#1C1917"/>
  <circle cx="51" cy="51" r="1" fill="#FFFFFF"/>
  <circle cx="71" cy="51" r="1" fill="#FFFFFF"/>

  <!-- Eyebrows -->
  <path d="M44 44 Q50 42 55 45" stroke="#1C1917" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M65 45 Q70 42 76 44" stroke="#1C1917" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Nose -->
  <path d="M60 52 L58 58 L62 58" stroke="#B45309" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Stubble / Beard hint -->
  <path d="M46 64 Q60 76 74 64" stroke="#78350F" stroke-width="1" stroke-dasharray="2 3" fill="none" opacity="0.6"/>

  <!-- Smile -->
  <path d="M52 64 Q60 70 68 64" stroke="#78350F" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Small Customer Badge Ring -->
  <circle cx="100" cy="100" r="14" fill="#F97316" stroke="#FFFFFF" stroke-width="2"/>
  <text x="100" y="104" font-size="11" font-family="system-ui, sans-serif" font-weight="900" fill="#FFFFFF" text-anchor="middle">C3</text>
</svg>
