<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#065F46"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
    <linearGradient id="coreAI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84CC16"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="visorAI" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#84CC16"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="60" cy="60" r="58" fill="url(#bgAI)" stroke="#84CC16" stroke-width="2"/>

  <!-- AI Aura Pulses -->
  <circle cx="60" cy="60" r="46" fill="none" stroke="#84CC16" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>
  <circle cx="60" cy="60" r="52" fill="none" stroke="#06B6D4" stroke-width="0.75" stroke-dasharray="2 6" opacity="0.3"/>

  <!-- Cybernetic Chassis -->
  <path d="M26 116 C26 90 40 80 60 80 C80 80 94 90 94 116 Z" fill="#0F172A"/>
  <path d="M48 80 L60 100 L72 80 Z" fill="url(#coreAI)" opacity="0.8"/>

  <!-- Neck -->
  <rect x="54" y="66" width="12" height="18" rx="2" fill="#1E293B"/>

  <!-- Robot / AI Head -->
  <rect x="38" y="30" width="44" height="40" rx="14" fill="#0F172A" stroke="#84CC16" stroke-width="2"/>
  
  <!-- Glowing Cybernetic Visor -->
  <rect x="42" y="42" width="36" height="16" rx="8" fill="url(#visorAI)"/>
  <circle cx="50" cy="50" r="3.5" fill="#FFFFFF"/>
  <circle cx="70" cy="50" r="3.5" fill="#FFFFFF"/>
  <line x1="45" y1="50" x2="75" y2="50" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>

  <!-- Head Antennas / Audio Nodes -->
  <rect x="33" y="44" width="5" height="12" rx="2" fill="#84CC16"/>
  <rect x="82" y="44" width="5" height="12" rx="2" fill="#84CC16"/>
  <line x1="60" y1="30" x2="60" y2="20" stroke="#84CC16" stroke-width="2"/>
  <circle cx="60" cy="18" r="4" fill="#84CC16"/>

  <!-- Small AI Badge Ring -->
  <circle cx="100" cy="100" r="14" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>
  <text x="100" y="104" font-size="10" font-family="system-ui, sans-serif" font-weight="900" fill="#FFFFFF" text-anchor="middle">AI</text>
</svg>
