<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBank" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0C4A6E"/>
    </linearGradient>
    <linearGradient id="suitBank" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadowBank" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="60" cy="60" r="58" fill="url(#bgBank)" stroke="#38BDF8" stroke-width="2"/>

  <!-- Subtle BG Light -->
  <circle cx="60" cy="35" r="40" fill="#BAE6FD" opacity="0.25"/>

  <!-- Body / Formal Suit -->
  <path d="M22 116 C22 90 38 80 60 80 C82 80 98 90 98 116 Z" fill="url(#suitBank)"/>

  <!-- Crisp White Shirt & Navy Silk Tie -->
  <path d="M46 80 L60 102 L74 80 Z" fill="#FFFFFF"/>
  <path d="M57 84 L63 84 L65 106 L60 114 L55 106 Z" fill="#0369A1"/>

  <!-- Neck -->
  <rect x="52" y="64" width="16" height="20" rx="3" fill="#FCD34D"/>

  <!-- Head Base -->
  <ellipse cx="60" cy="52" rx="21" ry="24" fill="#FBBF24" filter="url(#shadowBank)"/>

  <!-- Ears -->
  <ellipse cx="38" cy="52" rx="4" ry="7" fill="#F59E0B"/>
  <ellipse cx="82" cy="52" rx="4" ry="7" fill="#F59E0B"/>

  <!-- Silver Templed / Executive Hair -->
  <path d="M38 44 C38 24 50 18 64 20 C76 22 82 30 82 44 C78 34 70 28 60 28 C50 28 42 34 38 44 Z" fill="#475569"/>
  <path d="M38 38 C40 28 52 22 64 22 C72 22 78 26 80 32 C78 28 70 24 62 24 C50 24 42 30 38 38 Z" fill="#94A3B8"/>

  <!-- Executive Wireframe Glasses -->
  <rect x="42" y="44" width="15" height="11" rx="3" fill="none" stroke="#E2E8F0" stroke-width="1.8"/>
  <rect x="63" y="44" width="15" height="11" rx="3" fill="none" stroke="#E2E8F0" stroke-width="1.8"/>
  <line x1="57" y1="49" x2="63" y2="49" stroke="#E2E8F0" stroke-width="1.8"/>
  <line x1="38" y1="48" x2="42" y2="48" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="78" y1="48" x2="82" y2="48" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Eyes behind glasses -->
  <circle cx="49" cy="49" r="2.8" fill="#0F172A"/>
  <circle cx="71" cy="49" r="2.8" fill="#0F172A"/>
  <circle cx="50" cy="48" r="1" fill="#FFFFFF"/>
  <circle cx="72" cy="48" r="1" fill="#FFFFFF"/>

  <!-- Eyebrows -->
  <path d="M43 41 Q49 38 55 41" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M65 41 Q71 38 77 41" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Nose -->
  <path d="M60 50 L58 56 L62 56" stroke="#D97706" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Confident Smile -->
  <path d="M53 63 Q60 67 67 63" stroke="#78350F" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Small Bank / Security Shield Badge Ring -->
  <circle cx="100" cy="100" r="14" fill="#0284C7" stroke="#FFFFFF" stroke-width="2"/>
  <text x="100" y="104" font-size="9" font-family="system-ui, sans-serif" font-weight="900" fill="#FFFFFF" text-anchor="middle">BNK</text>
</svg>
